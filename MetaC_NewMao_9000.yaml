
# 锚点定义
provider-base: &provider-base {type: http, interval: 42300, health-check: {enable: true, url: http://www.gstatic.com/generate_204, interval: 300}}

url-test-base: &url-test-base {type: url-test, interval: 180, tolerance: 50, lazy: false, url: 'http://www.gstatic.com/generate_204', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: false, use: [Red-Airport]}
url-test-CF: &url-test-CF {type: url-test, interval: 180, tolerance: 50, lazy: false, url: 'http://www.gstatic.com/generate_204', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: false, use: [Self-Build]}

select-common-proxies: &select-common-proxies {type: select, proxies: [HongKong, TaiWan, Japan, Korea, Singapore, America, MyNodes, AllServer]}
select-streaming-proxies: &select-streaming-proxies {type: select, proxies: [Proxy, HongKong, Singapore, TaiWan, Japan, Korea, America]}
direct-proxy: &direct-proxy {type: select, proxies: [DIRECT, Proxy]}


HK: &HK '^(?=.*((?i)香港|(\b(HK|Hong)\b))).*$'
TW: &TW '^(?=.*((?i)台湾|(\b(TW|Tai|Taiwan)\b))).*$'
JP: &JP '^(?=.*((?i)日本|(\b(JP|Japan)\b))).*$'
KR: &KR '^(?=.*((?i)韩国|韓|首尔|(\b(KR|Korea)\b))).*$'
SG: &SG '^(?=.*((?i)新加坡|狮|(\b(SG|Singapore)\b))).*$'
US: &US '^(?=.*((?i)美国|(\b(US|United States)\b))).*$'
All: &All '^(?=.*(.))(?!.*((?i)回国|校园|游戏|自建|CF|🎮|(\b(GAME)\b))).*$'

# 定义锚点
domain-mrs: &domain-mrs { type: http, interval: 86400, behavior: domain, format: mrs }
domain-text: &domain-text { type: http, interval: 86400, behavior: domain, format: text }
classical-text: &classical-text { type: http, interval: 86400, behavior: classical, format: text }
ipcidr-mrs: &ipcidr-mrs { type: http, interval: 86400, behavior: ipcidr, format: mrs }


# 远程订阅
