dns:
  enable: true
  listen: '[::]:1053'
  use-hosts: true
  ipv6: true
  default-nameserver: [ https://223.5.5.5/dns-query, 2400:3200::1 ]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - 'rule-set:fakeip-filter,cn,private,apple-domain,google-cn,games-cn,microsoft-cn,my_fakeip'
  respect-rules: true
  nameserver-policy:
    rule-set:fakeip-filter,cn,private,apple-domain,google-cn,games-cn,microsoft-cn,my_direct:
      - 192.168.50.1

  proxy-server-nameserver : [ https://223.5.5.5/dns-query, 2400:3200::1 ]
  nameserver:
    - https://8.8.8.8/dns-query#ecs=123.113.109.124/24    
    - https://8.8.4.4/dns-query#ecs=123.113.109.124/24 
                                                                                                                                                  

